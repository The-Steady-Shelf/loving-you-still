<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#4A5E45">
<title>Loving You Still: Pet Loss Journal</title><style>
:root{
  --bg:#FAF8F3; --card:#FFFFFF; --ink:#2B2823; --grey:#5E574D;
  --accent:#4A5E45; --accent2:#D9E3D2; --warm:#B98A4A; --warmText:#8A6430; --line:#E8E0D0; --danger:#B3261E;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; font-family:'Segoe UI',system-ui,-apple-system,sans-serif; color:var(--ink); font-size:16px; line-height:1.5;
  background: radial-gradient(1200px 600px at 10% -10%, color-mix(in srgb, var(--accent2) 18%, var(--bg)) 0%, var(--bg) 55%),
              radial-gradient(900px 500px at 110% 10%, color-mix(in srgb, var(--accent) 12%, var(--bg)) 0%, var(--bg) 60%),
              var(--bg);
  min-height:100vh; padding-bottom:40px;
}
.wrap{ max-width:760px; margin:0 auto; padding:24px 16px 60px; }
.app-header{ text-align:center; margin-bottom:18px; }
.app-header .kicker{ font-size:12px; letter-spacing:3px; text-transform:uppercase; color:var(--warmText); font-weight:700; margin-bottom:6px; }
.app-header h1{ font-family:Georgia,'Times New Roman',serif; font-size:30px; color:var(--accent); margin:0 0 6px; line-height:1.15; }
.app-header .sub{ font-family:Georgia,serif; font-style:italic; color:var(--grey); font-size:16px; margin:0 auto; }
.deco{ display:flex; justify-content:center; margin:8px 0 10px; opacity:.85; }
nav.tabs{ display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin-bottom:20px; }
nav.tabs button{
  border:1.5px solid var(--line); background:var(--card); color:var(--ink); font-size:14px; font-family:inherit;
  padding:8px 14px; min-height:44px; border-radius:22px; cursor:pointer; display:flex; align-items:center; gap:6px;
  transition:all .15s ease; font-weight:600;
}
nav.tabs button:hover{ border-color:var(--accent); }
nav.tabs button.active{ background:var(--accent); color:#fff; border-color:var(--accent); }
nav.tabs button .ico{ width:16px; height:16px; display:flex; }
.card{
  background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px;
  box-shadow:0 2px 18px -6px color-mix(in srgb, var(--accent) 18%, transparent); margin-bottom:16px;
}
.card h2{ font-family:Georgia,serif; color:var(--accent); font-size:22px; margin:0 0 6px; line-height:1.25; }
.card h3{ font-family:Georgia,serif; color:var(--accent); font-size:19px; margin:0 0 8px; }
.card .lede{ color:var(--grey); font-size:15px; margin-bottom:16px; font-family:Georgia,serif; }
.btn{
  background:var(--accent); color:#fff; border:none; padding:10px 20px; min-height:44px; border-radius:10px; font-family:inherit;
  font-size:15px; font-weight:600; cursor:pointer; transition:transform .1s ease, opacity .15s ease;
}
.btn:hover{ opacity:.92; }
.btn:active{ transform:scale(.98); }
.btn.ghost{ background:transparent; color:var(--accent); border:1.5px solid var(--accent); }
.btn.sm{ padding:8px 14px; font-size:14px; }
.btn.wide{ width:100%; }
.del{ background:transparent; border:1.5px solid var(--line); color:var(--grey); border-radius:8px;
  padding:8px 14px; min-height:44px; font-size:14px; cursor:pointer; font-weight:600; font-family:inherit; }
.del:hover{ border-color:var(--danger); color:var(--danger); }
.item-actions{ display:flex; justify-content:flex-end; margin-top:10px; }
textarea,input[type=text],input[type=date]{
  width:100%; border:1.5px solid var(--line); border-radius:10px; padding:10px 12px; font-size:16px; min-height:44px;
  font-family:inherit; color:var(--ink); background:#fff; margin-bottom:10px;
}
textarea{ min-height:96px; resize:vertical; line-height:1.5; }
textarea:focus,input:focus{ outline:2px solid color-mix(in srgb, var(--accent) 45%, white); outline-offset:1px; border-color:var(--accent); }
.err-msg{ color:var(--danger); font-size:14px; margin:-4px 0 10px; }
label{ font-size:12.5px; font-weight:700; color:var(--grey); text-transform:uppercase; letter-spacing:.5px; display:block; margin-bottom:4px; }
.hint{ font-size:13px; color:var(--grey); margin:-6px 0 10px; }
.field{ margin-bottom:12px; }
.empty{ text-align:center; color:var(--grey); font-style:italic; font-family:Georgia,serif; padding:24px 10px; font-size:16px; }
.toast{
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px); opacity:0;
  background:var(--ink); color:#fff; padding:12px 18px; border-radius:10px; font-size:15px;
  transition:all .25s ease; pointer-events:none; z-index:50; max-width:90vw; text-align:center;
}
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
.dialog-backdrop{
  position:fixed; inset:0; background:rgba(20,15,20,.45); display:flex; align-items:center; justify-content:center;
  padding:20px; z-index:60; opacity:0; pointer-events:none; transition:opacity .2s ease;
}
.dialog-backdrop.show{ opacity:1; pointer-events:auto; }
.dialog{ background:var(--card); border-radius:16px; padding:22px; max-width:420px; width:100%; max-height:85vh; overflow:auto; }
.dialog h3{ font-family:Georgia,serif; color:var(--accent); margin:0 0 10px; font-size:20px; line-height:1.3; }
.dialog p{ margin:0 0 6px; color:var(--grey); }
.dialog-actions{ display:flex; gap:10px; margin-top:16px; }
.dialog-actions .btn{ flex:1; }
.footer-note{ text-align:center; color:var(--grey); font-size:13px; font-style:italic; margin-top:30px; font-family:Georgia,serif; }
svg.ic{ width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }

.mem-card{ background:color-mix(in srgb, var(--accent2) 30%, white); border-radius:12px; padding:14px 16px; margin-bottom:10px; }
.mem-date{ font-size:13px; color:var(--grey); margin-bottom:4px; }
.mem-text{ white-space:pre-wrap; }
.letter-text{ white-space:pre-wrap; font-family:Georgia,serif; font-size:16px; }
.capsule-card{ border:1.5px dashed var(--warm); border-radius:14px; padding:16px; margin-bottom:10px; background:color-mix(in srgb, var(--warm) 6%, white); }
.capsule-date{ font-size:14px; color:var(--warmText); font-weight:700; }
.capsule-text{ margin-top:8px; white-space:pre-wrap; font-family:Georgia,serif; font-size:17px; animation:reveal .9s ease both; }
@keyframes reveal{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:none; } }
.capsule-suggest{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
.capsule-suggest button{ font-size:14px; font-family:inherit; border:1.5px solid var(--line); background:#fff; color:var(--ink); border-radius:999px; padding:8px 14px; min-height:44px; cursor:pointer; }
.capsule-suggest button.on{ background:var(--accent2); border-color:var(--accent); color:var(--accent); font-weight:700; }
.memorial-card{ text-align:center; padding:26px 20px; border-radius:16px; background:linear-gradient(160deg, color-mix(in srgb, var(--accent2) 45%, white), white); border:1.5px solid var(--line); margin-bottom:16px; }
.pet-photo-wrap{ width:132px; height:132px; border-radius:50%; margin:0 auto 14px; overflow:hidden; border:4px solid #fff; box-shadow:0 4px 18px rgba(0,0,0,.12); background:var(--accent2); display:flex; align-items:center; justify-content:center; }
.pet-photo-wrap img{ width:100%; height:100%; object-fit:cover; }
.memorial-name{ font-family:Georgia,serif; font-size:28px; color:var(--accent); margin:4px 0; }
.memorial-dates{ font-size:15px; color:var(--grey); font-style:italic; }
.memorial-together{ margin-top:12px; display:inline-block; background:color-mix(in srgb, var(--warm) 15%, white); border-radius:999px; padding:6px 16px; font-size:14px; font-weight:700; color:var(--warmText); }
.upload-btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; border:1.5px solid var(--accent); border-radius:10px;
  padding:10px 18px; min-height:44px; font-size:15px; cursor:pointer; color:var(--accent); background:#fff; position:relative; margin:0 8px 10px 0;
  text-transform:none; letter-spacing:0; font-weight:600; }
.upload-btn:focus-within{ outline:2px solid color-mix(in srgb, var(--accent) 45%, white); }
.file-hidden{ opacity:0; position:absolute; inset:0; width:100%; height:100%; cursor:pointer; }
.form-row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
@media (max-width:420px){
  .form-row2{ grid-template-columns:1fr; }
  .form-row2 input{ min-width:0; }
  .wrap{ overflow-x:hidden; }
}
.reassure{ background:color-mix(in srgb, var(--warm) 15%, white); border-left:4px solid var(--warm); border-radius:10px; padding:12px 14px; font-size:14.5px; margin-top:12px; }
.banner{ display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; background:color-mix(in srgb, var(--warm) 14%, white); border:1.5px solid var(--warm); border-radius:14px; padding:12px 16px; margin-bottom:16px; font-family:Georgia,serif; font-size:16px; }
.capsule-badge{ display:inline-flex; align-items:center; gap:5px; font-size:12px; letter-spacing:1.5px; text-transform:uppercase; font-weight:800; color:var(--warmText); margin-bottom:8px; }
.print-memorial{ display:none; }
@media print{
  @page{ margin:0; }
  html,body{ background:#fff !important; height:auto; padding:0; }
  .wrap, .toast, .dialog-backdrop{ display:none !important; }
  .print-memorial{ display:flex !important; align-items:center; justify-content:center; width:100%; height:250mm; overflow:hidden; page-break-after:avoid; break-after:avoid; }
}
</style></head>
<body>
<div class="wrap">

<div class="app-header">
  <div class="kicker">A Grief Journal</div>
  <h1>Loving You Still</h1>
  <div class="deco"><svg width="42" height="18" viewBox="0 0 42 18" fill="none" stroke="#B98A4A" stroke-width="1.3" aria-hidden="true"><path d="M1 9c3-7 7-7 10 0s7 7 10 0 7-7 10 0 7 7 10 0"/></svg></div>
  <div class="sub">A gentle place to remember them.</div>
</div>

<nav class="tabs" id="tabNav" aria-label="Journal sections">
<button data-tab="memorial" onclick="setTab('memorial')"><span class="ico"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/></svg></span>Memorial</button>
<button data-tab="remember" onclick="setTab('remember')"><span class="ico"><svg class="ic" viewBox="0 0 24 24"><path d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6c-2.5 4.5-9.5 9-9.5 9z"/></svg></span>Memories</button>
<button data-tab="letters" onclick="setTab('letters')"><span class="ico"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></span>Letters</button>
<button data-tab="capsule" onclick="setTab('capsule')"><span class="ico"><svg class="ic" viewBox="0 0 24 24"><rect x="4" y="9" width="16" height="11" rx="2"/><path d="M4 9l8-6 8 6"/></svg></span>Capsules</button>
<button data-tab="more" onclick="setTab('more')"><span class="ico"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 21h16"/></svg></span>Backup</button>
</nav>
<div id="bannerRoot"></div>
<div id="tabRoot"></div>
<div class="footer-note">Everything you write stays saved privately on this device. Not a substitute for grief counseling.</div>
</div>
<script>
const PAW_SVG = `<svg width="46" height="46" viewBox="0 0 64 64" aria-hidden="true" fill="#B98A4A" opacity=".75"><ellipse cx="20" cy="22" rx="6" ry="8"/><ellipse cx="44" cy="22" rx="6" ry="8"/><ellipse cx="9" cy="36" rx="5.5" ry="7"/><ellipse cx="55" cy="36" rx="5.5" ry="7"/><path d="M32 32c-9 0-17 10-17 17 0 6 5 8 9 7 3-1 5-2 8-2s5 1 8 2c4 1 9-1 9-7 0-7-8-17-17-17z"/></svg>`;

function loadState(key, seed){
  try{
    const raw = localStorage.getItem(key);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return seed;
}
// Returns true/false based on whether the write actually succeeded (quota, private mode, etc).
function saveState(key, state){
  try{ localStorage.setItem(key, JSON.stringify(state)); return true; }
  catch(e){ return false; }
}
function toast(msg){
  let t = document.getElementById('toastEl');
  if(!t){ t = document.createElement('div'); t.id='toastEl'; t.className='toast'; t.setAttribute('role','status'); document.body.appendChild(t); }
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=> t.classList.remove('show'), 2600);
}
// Parse a "YYYY-MM-DD" string as a LOCAL date (never hand it straight to new Date(),
// which treats it as UTC midnight and can display as the previous day).
function parseLocalDate(s){
  if(!s) return null;
  const parts = s.split('-');
  if(parts.length!==3) return null;
  const y = parseInt(parts[0],10), m = parseInt(parts[1],10), d = parseInt(parts[2],10);
  if(!y || !m || !d) return null;
  const dt = new Date(y, m-1, d);
  return isNaN(dt) ? null : dt;
}
// "5 January 2024" style in the buyer's own language, never ambiguous like 1/5/2024.
function formatLocalDate(dt){
  if(!dt) return '';
  return dt.toLocaleDateString(undefined, {day:'numeric', month:'long', year:'numeric'});
}
function fmt(s){ return formatLocalDate(parseLocalDate(s)); }
function toDateInputValue(dt){
  const y = dt.getFullYear();
  const m = String(dt.getMonth()+1).padStart(2,'0');
  const d = String(dt.getDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}
function todayLocalStr(){ return toDateInputValue(new Date()); }
function tomorrowLocalStr(){ const d = new Date(); d.setDate(d.getDate()+1); return toDateInputValue(d); }
function openDialog(html){
  let bd = document.getElementById('dialogBackdrop');
  if(!bd){ bd = document.createElement('div'); bd.id='dialogBackdrop'; bd.className='dialog-backdrop';
    bd.onclick = (e)=>{ if(e.target===bd) closeDialog(); };
    document.body.appendChild(bd); }
  bd.innerHTML = '<div class="dialog" role="dialog" aria-modal="true">'+html+'</div>';
  bd.classList.add('show');
  const first = bd.querySelector('button'); if(first) first.focus();
}
function closeDialog(){
  const bd = document.getElementById('dialogBackdrop');
  if(bd) bd.classList.remove('show');
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeDialog(); });
function esc(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

// Destructive confirm: delete actions are never one tap with no way back.
window.__confirmAction = null;
function confirmAction(message, onConfirm, keepLabel, actionLabel){
  keepLabel = keepLabel || 'Keep it';
  actionLabel = actionLabel || 'Remove';
  window.__confirmAction = onConfirm;
  openDialog(`<h3>${esc(message)}</h3>
    <div class="dialog-actions">
      <button class="btn ghost" onclick="closeDialog()">${esc(keepLabel)}</button>
      <button class="btn" style="background:var(--danger);" onclick="(window.__confirmAction&&window.__confirmAction()); closeDialog();">${esc(actionLabel)}</button>
    </div>`);
}
let currentTab = 'memorial';
function setTab(id){
  currentTab=id;
  updateNavActive();
  render();
  window.scrollTo(0,0);
}
function updateNavActive(){
  document.querySelectorAll('nav.tabs button').forEach(btn=>{
    const on = btn.getAttribute('data-tab')===currentTab;
    btn.classList.toggle('active', on);
    btn.setAttribute('aria-current', on ? 'page' : 'false');
  });
}

const STORE_KEY = 'petLossV2';
function seedState(){ return { name:'', species:'', photo:'', bornDate:'', lossDate:'', birthday:'', memories:[], letters:[], capsules:[], drafts:{mem:'',letter:'',capsule:''}, backupAt:0 }; }
let state = Object.assign(seedState(), loadState(STORE_KEY, {}));
if(!state.drafts) state.drafts = {mem:'',letter:'',capsule:''};
function persist(){ return saveState(STORE_KEY, state); }

function petName(){ return state.name || 'them'; }
function petNameTitle(){ return state.name || 'Them'; }

// Unsaved writing is kept as a draft while typing, so switching tabs never loses it.
function saveDraft(kind, v){ state.drafts[kind] = v; persist(); }

function onNameInput(v){
  state.name = v; persist();
  const nameEl = document.getElementById('memorialNameDisplay');
  if(nameEl) nameEl.textContent = v || 'Your Companion';
}

function onSpeciesInput(v){
  state.species = v; persist();
  const el = document.getElementById('memorialSpeciesDisplay'); if(el) el.textContent = v;
}
function timeTogetherText(){
  if(!state.bornDate || !state.lossDate) return '';
  const b = parseLocalDate(state.bornDate), l = parseLocalDate(state.lossDate);
  if(!b||!l||l<b) return '';
  let years = l.getFullYear()-b.getFullYear();
  let months = l.getMonth()-b.getMonth();
  if(l.getDate()<b.getDate()) months--;
  if(months<0){ years--; months+=12; }
  const parts=[];
  if(years>0) parts.push(years+' year'+(years!==1?'s':''));
  if(months>0) parts.push(months+' month'+(months!==1?'s':''));
  if(!parts.length) parts.push('under a month');
  return parts.join(', ');
}
// One clear line whichever dates are filled in, never "? to" or a stray "to".
function datesLine(){
  const m = state.bornDate ? fmt(state.bornDate) : '';
  const l = state.lossDate ? fmt(state.lossDate) : '';
  if(m && l) return `${m} to ${l}`;
  if(m) return `Together since ${m}`;
  if(l) return `Said goodbye on ${l}`;
  return '';
}

function totalEntries(){ return state.memories.length + state.letters.length + state.capsules.length; }
// A gentle backup nudge after every 5th thing written since the last backup.
function maybeNudgeBackup(){
  const since = totalEntries() - (state.backupAt||0);
  if(since>0 && since % 5 === 0){
    openDialog(`<h3>You have written a lot here.</h3>
      <p>Everything lives only on this device. A backup file keeps it safe if you change phones or clear your browser.</p>
      <div class="dialog-actions">
        <button class="btn ghost" onclick="closeDialog()">Later</button>
        <button class="btn" onclick="closeDialog(); downloadBackup();">Save a backup</button>
      </div>`);
  }
}

function render(){
  const root = document.getElementById('tabRoot');
  if(currentTab==='memorial') root.innerHTML = renderMemorial();
  if(currentTab==='remember') root.innerHTML = renderRemember();
  if(currentTab==='letters') root.innerHTML = renderLetters();
  if(currentTab==='capsule') root.innerHTML = renderCapsule();
  if(currentTab==='more') root.innerHTML = renderMore();
  renderBanner();
}
function isDue(c){ const d = parseLocalDate(c.openDate); return d && d.getTime() <= Date.now(); }
function renderBanner(){
  const el = document.getElementById('bannerRoot');
  const waiting = state.capsules.filter(c=> isDue(c) && !c.opened).length;
  el.innerHTML = (waiting && currentTab!=='capsule') ? `<div class="banner"><span>A message from you is waiting to be opened.</span><button class="btn sm" onclick="setTab('capsule')">Go to it</button></div>` : '';
}

// -------- Memorial --------
function renderMemorial(){
  const together = timeTogetherText();
  const photoHtml = state.photo ? `<img src="${state.photo}" alt="Photo of ${esc(state.name)||'your companion'}">` : PAW_SVG;
  const dl = datesLine();
  return `
  <div class="memorial-card" id="memorialCard">
    <div class="pet-photo-wrap">${photoHtml}</div>
    <div class="memorial-name" id="memorialNameDisplay">${esc(state.name)||'Your Companion'}</div>
    <div class="memorial-dates" id="memorialSpeciesDisplay">${esc(state.species)}</div>
    <div class="memorial-dates" id="memorialDatesDisplay">${dl}</div>
    <div id="memorialTogetherDisplay">${together ? `<div class="memorial-together">Loved for ${together}</div>` : ''}</div>
  </div>
  <div class="card">
    <h2>Start Here: Tell Me About Them</h2>
    <div class="lede">Fill this in once. Their name will appear on every page, and their photo on the memorial card. You can change any of it later.</div>
    <div class="field"><label for="fName">Their name</label><input id="fName" type="text" placeholder="e.g. Max, Luna, Bella" value="${esc(state.name)}" oninput="onNameInput(this.value)"></div>
    <div class="field"><label for="fSpecies">Species or breed (optional)</label><input id="fSpecies" type="text" placeholder="e.g. Golden Retriever, Tabby Cat" value="${esc(state.species)}" oninput="onSpeciesInput(this.value)"></div>
    <div class="form-row2">
      <div class="field"><label for="fMet">Day you met</label><input id="fMet" type="date" value="${state.bornDate||''}" onchange="onBornDateChange(this.value)"></div>
      <div class="field"><label for="fLoss">Day you said goodbye</label><input id="fLoss" type="date" value="${state.lossDate||''}" onchange="onLossDateChange(this.value)"></div>
    </div>
    <div class="field"><label for="fBday">Their birthday (optional)</label><input id="fBday" type="date" value="${state.birthday||''}" onchange="state.birthday=this.value; persist();"><div class="hint">Used to suggest a capsule for their next birthday.</div></div>
    <label>Their photo</label>
    <label class="upload-btn"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>${state.photo ? 'Change photo' : 'Add their photo'}<input type="file" accept="image/*" class="file-hidden" id="photoInput" onchange="handlePhotoUpload(event)"></label>
    ${state.photo ? `<button class="btn ghost sm" onclick="removePhoto()">Remove photo</button>` : ''}
    <div class="reassure">Their photo stays only on this device. Nothing is ever uploaded anywhere.</div>
  </div>
  <div class="card">
    <h2>Printable Memorial Card</h2>
    <div class="lede">A one page keepsake to print or save as a PDF, for a frame, a shelf, or someone else who loved them too.</div>
    <button class="btn wide" onclick="printMemorial()">Print or save as PDF</button>
  </div>`;
}

function onBornDateChange(v){ state.bornDate = v; persist(); updateMemorialDatesDisplay(); }
function onLossDateChange(v){ state.lossDate = v; persist(); updateMemorialDatesDisplay(); }
function updateMemorialDatesDisplay(){
  const datesEl = document.getElementById('memorialDatesDisplay');
  const togetherEl = document.getElementById('memorialTogetherDisplay');
  if(datesEl) datesEl.textContent = datesLine();
  const together = timeTogetherText();
  if(togetherEl) togetherEl.innerHTML = together ? `<div class="memorial-together">Loved for ${together}</div>` : '';
}

function handlePhotoUpload(ev){
  const file = ev.target.files[0];
  if(!file) return;
  if(file.size > 15*1024*1024){ toast('That photo is too large to use. Try a smaller one.'); return; }
  const reader = new FileReader();
  reader.onload = ()=>{
    compressPhoto(reader.result, (dataUrl)=>{
      const old = state.photo;
      state.photo = dataUrl;
      const ok = persist();
      if(!ok){ state.photo = old; persist(); }
      render();
      toast(ok ? 'Photo added' : 'Could not save. Your device storage is full.');
    });
  };
  reader.onerror = ()=> toast('Could not read that photo');
  reader.readAsDataURL(file);
}
// Resizes to 800px wide and re-encodes as JPEG before it is ever stored,
// so one large photo can't silently blow the storage quota.
function compressPhoto(dataUrl, cb){
  const img = new Image();
  img.onload = ()=>{
    const targetW = 800;
    const scale = img.width > targetW ? targetW / img.width : 1;
    const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
    try{ cb(canvas.toDataURL('image/jpeg', 0.8)); }
    catch(e){ cb(dataUrl); }
  };
  img.onerror = ()=> cb(dataUrl);
  img.src = dataUrl;
}
function removePhoto(){
  confirmAction('Remove their photo?', ()=>{ state.photo=''; persist(); render(); });
}
function printMemorial(){
  let pw = document.getElementById('printArea');
  if(!pw){ pw = document.createElement('div'); pw.id='printArea'; pw.className='print-memorial'; document.body.appendChild(pw); }
  const together = timeTogetherText();
  const dl = datesLine();
  const photoHtml = state.photo ? `<img src="${state.photo}" alt="" style="width:300px;height:300px;border-radius:50%;object-fit:cover;border:8px solid #fff;box-shadow:0 4px 18px rgba(0,0,0,.15);">` : `<div style="opacity:.9">${PAW_SVG.replace('width="46" height="46"','width="90" height="90"')}</div>`;
  pw.innerHTML = `<div style="text-align:center; padding:40px; font-family:Georgia,serif; color:#2B2823;">
    ${photoHtml}
    <div style="color:#8A6430; font-size:15px; letter-spacing:4px; text-transform:uppercase; margin:34px 0 10px;">In Loving Memory Of</div>
    <div style="font-size:56px; color:#4A5E45; line-height:1.1; margin:0 0 14px;">${esc(state.name)||'Our Beloved Companion'}</div>
    ${state.species?`<div style="font-style:italic; color:#5E574D; font-size:20px;">${esc(state.species)}</div>`:''}
    ${dl ? `<div style="margin-top:10px; color:#5E574D; font-size:20px;">${dl}</div>` : ''}
    ${together ? `<div style="margin-top:20px; font-size:20px; color:#8A6430; font-weight:bold;">Loved for ${together}</div>` : ''}
    <svg width="60" height="20" viewBox="0 0 42 18" fill="none" stroke="#B98A4A" stroke-width="1.3" style="margin-top:34px"><path d="M1 9c3-7 7-7 10 0s7 7 10 0 7-7 10 0 7 7 10 0"/></svg>
    <div style="margin-top:14px; font-style:italic; color:#5E574D; font-size:20px;">Until we meet again.</div>
  </div>`;
  window.print();
}

// -------- Memories --------
function renderRemember(){
  const mems = state.memories.slice().reverse().map(m=> `
    <div class="mem-card">
      <div class="mem-date">${formatLocalDate(new Date(m.date))}</div>
      <div class="mem-text">${esc(m.text)}</div>
      <div class="item-actions"><button class="del" onclick="confirmRemoveMemory('${m.id}')">Remove</button></div>
    </div>`).join('');
  return `
  <div class="card">
    <h2>Memories of ${esc(petNameTitle())}</h2>
    <div class="lede">Add a memory whenever one comes to you. Small ones count.</div>
    <label for="newMem" style="position:absolute;left:-9999px">A memory</label>
    <textarea id="newMem" placeholder="A memory, a habit, something only they did..." oninput="saveDraft('mem', this.value)">${esc(state.drafts.mem)}</textarea>
    <button class="btn" onclick="addMemory()">Save this memory</button>
  </div>

function renderLetters(){
  const list = state.letters.slice().reverse().map(l=> `
    <div class="card" style="padding:16px;">
      <div class="mem-date">${formatLocalDate(new Date(l.date))}</div>
      <div class="letter-text">${esc(l.text)}</div>

    </div>`).join('');

  <div class="card">
    <h2>A Letter to ${esc(petNameTitle())}</h2>

    <label for="newLetter" style="position:absolute;left:-9999px">Your letter</label>

// -------- Capsules --------
// Only ever suggests dates still ahead, built from local date parts (never UTC).
function nextYearly(src){
  const s = parseLocalDate(src); if(!s) return null;
  const t = parseLocalDate(todayLocalStr());
  let d = new Date(t.getFullYear(), s.getMonth(), s.getDate());
  if(d.getTime() <= t.getTime()) d = new Date(t.getFullYear()+1, s.getMonth(), s.getDate());
  return d;
}
function suggestedDates(){
  const out = [];
  const t = parseLocalDate(todayLocalStr()).getTime();
  const mk = (label, d)=> ({label, date: toDateInputValue(d)});
  const l = parseLocalDate(state.lossDate);
  if(l){
    const oneMonth = new Date(l.getFullYear(), l.getMonth()+1, l.getDate());
    const sixMonth = new Date(l.getFullYear(), l.getMonth()+6, l.getDate());
    if(oneMonth.getTime() > t) out.push(mk('1 month from goodbye', oneMonth));
    if(sixMonth.getTime() > t) out.push(mk('6 months from goodbye', sixMonth));
    const ann = nextYearly(state.lossDate);
    const years = ann.getFullYear() - l.getFullYear();
    out.push(mk(years===1 ? '1 year since goodbye' : `${years} years since goodbye`, ann));
  }
  if(state.birthday){ out.push(mk('Their next birthday', nextYearly(state.birthday))); }
  return out;
}
function pickSuggested(btn, date){
  document.getElementById('capsuleDate').value = date;
  document.querySelectorAll('.capsule-suggest button').forEach(b=> b.classList.toggle('on', b===btn));
  document.getElementById('capsuleErr').style.display='none';
}
function renderCapsule(){
  const list = state.capsules.slice().sort((a,b)=> a.openDate.localeCompare(b.openDate)).map(c=> {
    const due = isDue(c);
    let body;
    if(!due) body = `<div class="capsule-date">Opens ${fmt(c.openDate)}</div><div style="margin-top:6px; font-style:italic; color:var(--grey);">Sealed. A message is waiting here for you.</div>`;
    else if(!c.opened) body = `<div class="capsule-date">Ready since ${fmt(c.openDate)}</div><div style="margin:6px 0 10px; font-family:Georgia,serif;">You wrote something for today. Open it when you are ready.</div><button class="btn" onclick="openCapsule('${c.id}')">Open my capsule</button>`;
    else body = `<div class="capsule-date">Opened, written for ${fmt(c.openDate)}</div><div class="capsule-text">${esc(c.text)}</div>`;
    return `<div class="capsule-card">${body}<div class="item-actions"><button class="del" onclick="confirmRemoveCapsule('${c.id}')">Remove</button></div></div>`;
  }).join('');
  const suggestions = suggestedDates();
  const suggestHtml = suggestions.length ? `
    <div class="field"><label>Pick a date from ${esc(petName())}'s story</label>
    <div class="capsule-suggest">${suggestions.map(s=>`<button type="button" onclick="pickSuggested(this,'${s.date}')">${esc(s.label)}</button>`).join('')}</div></div>` : '';
  return `
  <div class="card">
    <div class="capsule-badge">For later</div>
    <h2>Memory Capsules</h2>
    <div class="lede">Write yourself something now and seal it until a future day: their birthday, the anniversary, or a hard day you know is coming. It stays hidden until then.</div>
    <div class="field"><label for="capsuleText">Write to your future self</label><textarea id="capsuleText" rows="4" placeholder="Something to find later..." oninput="saveDraft('capsule', this.value)">${esc(state.drafts.capsule)}</textarea></div>
    ${suggestHtml}
    <div class="field"><label for="capsuleDate">${suggestions.length ? 'Or choose any date' : 'Open on this date'}</label><input type="date" id="capsuleDate" min="${tomorrowLocalStr()}" onchange="document.querySelectorAll('.capsule-suggest button').forEach(b=>b.classList.remove('on'))"></div>
    <div id="capsuleErr" class="err-msg" style="display:none;">Please pick a date after today.</div>
    <button class="btn" onclick="addCapsule()">Seal this capsule</button>
  </div>
  ${list || '<div class="empty">No capsules yet. Seal one above.</div>'}`;
}
function openCapsule(id){
  const c = state.capsules.find(x=>x.id===id); if(!c) return;
  c.opened = true; persist(); render();
}

function addMemory(){
  const v = document.getElementById('newMem').value;
  if(!v.trim()){ toast('Write a few words first.'); return; }
  state.memories.push({id:uid(), text:v, date:new Date().toISOString()});
  state.drafts.mem = '';
  const ok = persist();
  toast(ok ? 'Memory saved' : 'Could not save. Your device storage is full.');
  render(); if(ok) maybeNudgeBackup();
}
function confirmRemoveMemory(id){ confirmAction('Remove this memory? This cannot be undone.', ()=>{ removeMemory(id); }); }
function removeMemory(id){ state.memories = state.memories.filter(m=>m.id!==id); persist(); render(); }

function addLetter(){
  const v = document.getElementById('newLetter').value;
  const stripped = v.replace(/^Dear[^\n]*,?\s*/,'');
  if(!stripped.trim()){ toast('Write a few words first.'); return; }
  state.letters.push({id:uid(), text:v, date:new Date().toISOString()});
  state.drafts.letter = '';
  const ok = persist();
  toast(ok ? 'Letter saved' : 'Could not save. Your device storage is full.');
  render(); if(ok) maybeNudgeBackup();
}
function confirmRemoveLetter(id){ confirmAction('Remove this letter? This cannot be undone.', ()=>{ removeLetter(id); }); }
function removeLetter(id){ state.letters = state.letters.filter(l=>l.id!==id); persist(); render(); }

function addCapsule(){
  const t = document.getElementById('capsuleText').value;
  const d = document.getElementById('capsuleDate').value;
  const errEl = document.getElementById('capsuleErr');
  if(!t.trim()){ toast('Write a few words first.'); return; }
  if(!d){ errEl.textContent='Please pick a date to open it.'; errEl.style.display='block'; return; }
  const picked = parseLocalDate(d);
  const todayStart = parseLocalDate(todayLocalStr());
  if(!picked || picked.getTime() <= todayStart.getTime()){
    errEl.textContent='Please pick a date after today.'; errEl.style.display='block'; return;
  }
  errEl.style.display='none';
  state.capsules.push({id:uid(), text:t, openDate:d, opened:false});
  state.drafts.capsule = '';
  const ok = persist();
  toast(ok ? `Sealed until ${fmt(d)}` : 'Could not save. Your device storage is full.');
  render(); if(ok) maybeNudgeBackup();
}
function confirmRemoveCapsule(id){ confirmAction('Remove this capsule? This cannot be undone.', ()=>{ removeCapsule(id); }); }
function removeCapsule(id){ state.capsules = state.capsules.filter(c=>c.id!==id); persist(); render(); }

// -------- Backup + about --------
function renderMore(){
  const n = totalEntries();
  return `
  <div class="card">
    <h2>Keep Your Journal Safe</h2>
    <div class="lede">Everything you write lives only on this device. Save a backup file now and then, especially before changing phones or clearing your browser.</div>
    <button class="btn wide" onclick="downloadBackup()">Save a backup file</button>
    <div class="hint" style="margin:8px 0 0;">${n ? `${n} saved ${n===1?'entry':'entries'} on this device.` : 'Nothing saved yet.'}</div>
    <div style="margin-top:20px;">
      <label>Moving to a new phone?</label>
      <label class="upload-btn">Restore from a backup file<input type="file" accept="application/json,.json" class="file-hidden" onchange="restoreBackup(event)"></label>
    </div>
  </div>
  <div class="card">
    <h3>About This Journal</h3>
    <div class="lede" style="margin-bottom:10px;">Made by The Steady Shelf. Written using published research on pet loss and grief. It sits alongside your grief and does not rush it.</div>
    <div class="reassure" style="margin-top:0;">This journal is not a substitute for grief counseling or therapy. If grief is making daily life hard for weeks, a doctor, a grief counselor or a pet loss support line can help.</div>
  </div>`;
}
function downloadBackup(){
  try{
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'loving-you-still-backup-'+todayLocalStr()+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    state.backupAt = totalEntries(); persist();
    toast('Backup saved to your downloads');
  }catch(e){ toast('Could not create a backup file on this device'); }
}
// A restored file must look like this app's data and the buyer must confirm,
// so a random or corrupt file can never silently wipe real data.
function isValidBackupShape(obj){
  return obj && typeof obj === 'object'
    && Array.isArray(obj.memories) && Array.isArray(obj.letters) && Array.isArray(obj.capsules);
}
function restoreBackup(ev){
  const file = ev.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    let parsed;
    try{ parsed = JSON.parse(reader.result); }
    catch(e){ toast('That file could not be read as a backup'); return; }
    if(!isValidBackupShape(parsed)){
      toast('That file does not look like a journal backup. Nothing was changed.');
      return;
    }
    confirmAction('Replace everything on this device with this backup?', ()=>{
      state = Object.assign(seedState(), parsed);
      if(!state.drafts) state.drafts = {mem:'',letter:'',capsule:''};
      persist(); toast('Your journal is restored'); render();
    }, 'Cancel', 'Restore');
  };
  reader.onerror = ()=> toast('Could not read that file');
  reader.readAsText(file);
  ev.target.value = '';
}

document.addEventListener('DOMContentLoaded', ()=>{ updateNavActive(); render(); });
</script>
